# ==============================================================================
# 项目代码硬编码解耦集中配置 (config.toml) - 随代码提交入库
#
# 遵循 Agent Relay Hygiene 规范：
# - 唯一职责：代码硬编码解耦专用，集中承载所有非敏感的工程与业务参数
# - 包含：服务拓扑、运行旋钮、超时重试、资产路径、特性开关、Twitter协议常量等
# - 严禁存放任何敏感密钥与凭据 (敏感项留空或通过本地 .env 注入)
# ==============================================================================

[app]
name = "Xcollect"
title = "𝕏 书签智能聚合看板"
version = "1.0.0"
environment = "development"

[server]
port = 8089
host = "127.0.0.1"

[runtime]
timeout = 30.0
max_retries = 3
cache_seconds = 60
max_sync_pages = 25

[sync]
# Cloud Profile: 高频增量同步之外，每隔多久做一次完整集合对账，用于发现 X 端取消收藏。
reconcile_interval_hours = 6

[features]
enable_cloud_sync = true
enable_offline_cache = true

[twitter]
# Twitter Web 客户端公开请求网关常量
bearer_token = "Bearer AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA"
# Bookmarks queryId 会随 X Web 前端构建持续轮换；运行时优先从社区 registry 动态解析，以下仅作离线 fallback
query_id_registry_url = "https://raw.githubusercontent.com/fa0311/twitter-openapi/refs/heads/main/src/config/placeholder.json"
query_id_bookmarks = "XD0ViOeSOW4YoeNTGjVaYw"
query_id_bookmarks_fallbacks = ["2neUNDqrrFzbLui8yallcQ", "i8QZ1qqy36ffA3bxfTaf7w"]
query_id_create = "aoDbu3RHznuiSkQ9aNM67Q"
query_id_delete = "Wlmlj2-xzyS1GN3a6cj-mQ"
# SearchTimeline 的 queryId / feature flags / GET|POST transport 都可能随 Web 构建变化；
# 运行时优先从社区 registry 动态解析，以下只作离线 fallback。
query_id_search = "Yw6L66Pw54NHKuq4Dp7b4Q"
query_id_search_fallbacks = []

[taxonomy]
default_categories = [
  "01_人工智能与Agent",
  "02_技术架构与开发",
  "03_开源精选与工具",
  "04_产品设计与思考",
  "05_前沿资讯与研读"
]

[ai]
# AI 算力调度策略: "auto" (自动降级: 自定义API -> Cloudflare Workers AI -> 本地规则兜底)
# 可选值: "auto" | "custom" | "workers_ai" | "rule"
provider = "auto"
custom_api_base = "https://api.deepseek.com/v1"
custom_model = "deepseek-chat"
workers_ai_models = [
  "@cf/meta/llama-3.1-8b-instruct-fast",
  "@cf/meta/llama-3.2-3b-instruct",
  "@cf/meta/llama-3.2-1b-instruct"
]

# Explicit opt-in: decision models incur Workers AI / third-party charges.
[decision]
enabled = false
allow_jev = false

[discovery]
enabled = true
interval_hours = 2.0
# Discovery 是滚动新鲜流，不是跨日知识库。候选以原推 created_at 的 UTC 年龄为准；
# 超过该窗口的未固化发现及其短期训练证据必须物理清除。
retention_hours = 24.0
queries_per_run = 3
search_count = 60
max_pages_per_query = 1
cheap_penalty_threshold = 0.42
min_text_chars = 36
min_final_score = 0.50
min_relevance = 0.45
min_quality = 0.35
ai_reject_probability = 0.60
ai_batch_max_candidates = 120
ai_judge_model = "@cf/meta/llama-4-scout-17b-16e-instruct"
daily_limit = 300
author_daily_cap = 3
subcategory_daily_cap = 24
category_daily_ratio_cap = 0.35

[ranking]
# related-hot 是推荐排序，不是简单互动量排序；所有正向权重之和应为 1.0。
related_hot_version = "rh_v1"
relevance_weight = 0.30
quality_weight = 0.20
novelty_weight = 0.15
velocity_weight = 0.15
source_weight = 0.10
freshness_weight = 0.10
freshness_half_life_hours = 48.0
velocity_age_exponent = 0.68
velocity_scale = 135.0

[feedback]
# Legacy weight field keeps sign only. Relative action magnitude is learned.
impression_weight = 0.0
open_detail_weight = 1.0
copy_weight = 1.0
open_original_weight = 1.0
bookmark_weight = 1.0
unbookmark_weight = -1.0
reject_candidate_weight = -1.0
not_interested_weight = -1.0
hide_author_weight = -1.0

[learning]
# Human policy defines ordinal action order; observed behavior learns distance.
positive_action_order = ["open_detail", "copy", "open_original", "bookmark"]
calibration_half_life_days = 30.0
conversion_prior_success = 1.0
conversion_prior_failure = 9.0
min_calibration_samples = 20

# Bounded preference fields consume normalized evidence in [-1, 1].
category_evidence_scale = 6.0
subcategory_evidence_scale = 4.0
author_evidence_scale = 4.0

# Query quality uses reject-vs-accepted Bayesian calibration.
query_reject_prior_alpha = 1.0
query_reject_prior_beta = 4.0
query_evidence_scale = 5.0
query_penalty_cap = 0.10

# Small exploration budget prevents self-confirming recommendation loops.
exploration_ratio = 0.08

[topology]
# 知识拓扑重整化阈值：未固化条目达到此数量触发重整化分析
renormalize_threshold = 30
# 单一专区占比上限（超过此比例视为过载密集簇，建议向下分裂）
max_cluster_ratio = 0.40
