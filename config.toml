# ==============================================================================
# 项目代码硬编码解耦集中配置 (config.toml) - 随代码提交入库
#
# 遵循 Agent Relay Hygiene 规范：
# - 唯一职责：代码硬编码解耦专用，集中承载所有非敏感的工程与业务参数
# - 包含：服务拓扑、运行旋钮、超时重试、资产路径、特性开关等
# - 严禁存放任何敏感密钥与凭据 (敏感项留空或通过本地 .env 注入)
# ==============================================================================

[app]
name = "Xcollect"
title = "𝕏 书签智能聚合看板"
version = "1.0.0"
environment = "development"

[server]
port = 8089
host = "127.0.0.1"

[runtime]
timeout = 30.0
max_retries = 3

[features]
enable_cloud_sync = true
enable_offline_cache = true

[taxonomy]
default_categories = [
  "01_人工智能与Agent",
  "02_技术架构与开发",
  "03_开源精选与工具",
  "04_产品设计与思考",
  "05_前沿资讯与研读"
]
