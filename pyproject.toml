[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcollect-cli"
version = "0.1.0"
description = "Read-only CLI for your private Xcollect bookmarks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xcollect = "xcollect_cli:main"

[tool.setuptools]
py-modules = ["xcollect_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]
namespaces = true
